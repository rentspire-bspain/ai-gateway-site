<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify your student email — ai.spaincos.com</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14646B">
<style>
  :root { --bg: #15171B; --fg: #E8E8E6; --muted: #9BA0A6; --border: #26282E; --surface: #1C1E24; --accent: #56ABAB; --ok: #4ADE80; --err: #F87171; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.65; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 24px 80px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; }
  h1 { font-size: 24px; font-weight: 650; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .icon { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; font-size: 26px; }
  .icon.pending { background: rgba(86,171,171,.12); color: var(--accent); }
  .icon.ok { background: rgba(74,222,128,.12); color: var(--ok); }
  .icon.err { background: rgba(248,113,113,.12); color: var(--err); }
  .grant { font-variant-numeric: tabular-nums; font-size: 15px; color: var(--fg); background: rgba(86,171,171,.08); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin: 0 0 24px; }
  .btn { display: inline-block; background: var(--accent); color: #101214; font-weight: 600; font-size: 14px; padding: 10px 22px; border-radius: 999px; text-decoration: none; border: none; cursor: pointer; }
  .btn:hover { filter: brightness(1.1); }
  .code-row { display: flex; gap: 8px; justify-content: center; margin: 0 0 16px; }
  .code-row input { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--fg); font-size: 15px; padding: 10px 12px; width: 100%; max-width: 340px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .msg { font-size: 13px; min-height: 20px; margin-top: 12px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); } .msg.muted { color: var(--muted); }
  .fine { color: var(--muted); font-size: 12px; margin-top: 28px; text-align: center; }
  .fine a { color: var(--accent); }
  @media (prefers-color-scheme: light) { :root { --bg: #F7F7F8; --fg: #1D1D1F; --muted: #666; --border: #E5E5E5; --surface: #FFFFFF; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="icon pending" id="ico">…</div>
    <h1 id="h">Verifying your student email</h1>
    <p id="p">Checking your verification link…</p>
    <div id="body" hidden>
      <div class="grant" id="grant" hidden>1,000 credits + 500 N added to your account</div>
      <div class="code-row" id="paste" hidden>
        <input id="code" placeholder="Paste your verification code" autocomplete="one-time-code" spellcheck="false" aria-label="Verification code">
        <button class="btn" id="go">Verify</button>
      </div>
      <a class="btn" id="home" href="https://ai.spaincos.com" hidden>Back to ai.spaincos.com</a>
    </div>
    <div class="msg muted" id="msg"></div>
  </div>
  <p class="fine">Verification links expire after 24 hours and can be used once. <a href="https://ai.spaincos.com/settings">Request a new code</a> · <a href="https://ai.spaincos.com/privacy">Privacy</a></p>
</main>
<script>
// Verify route — feeds the emailed token into student_verification_confirm as the signed-in user.
// If the visitor isn't signed in, they land in the paste-a-code path after signing in on the main app.
(function () {
  var K = window.NEURONS_PUBLISHABLE_KEY || "sb_publishable_nrmUxUfyytgCscz8zfQ9Cw_LapbvKIb";
  var SB = "https://bnxermyboeigvwonfrzx.supabase.co";
  var q = new URLSearchParams(location.search);
  var token = q.get("token") || "";
  var $ = function (id) { return document.getElementById(id); };
  function state(kind, h, p) {
    $("ico").className = "icon " + kind; $("ico").textContent = kind === "ok" ? "✓" : kind === "err" ? "!" : "…";
    $("h").textContent = h; $("p").textContent = p; $("body").hidden = false;
  }
  function rpc(name, body) {
    return fetch(SB + "/rest/v1/rpc/" + name, {
      method: "POST", headers: { apikey: K, "Content-Type": "application/json" }, body: JSON.stringify(body || {})
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; }); });
  }
  var msgEl = $("msg");
  function msg(t, cls) { msgEl.textContent = t || ""; msgEl.className = "msg " + (cls || "muted"); }
  function confirmNow(tok) {
    msg("Verifying…", "muted");
    rpc("student_verification_confirm", { p_token: tok }).then(function (r) {
      if (r.ok) { state("ok", "Student email verified", "Your campus bonus is live."); $("grant").hidden = false; $("home").hidden = false; }
      else {
        var m = String((r.body && (r.body.message || r.body.error)) || r.body || "").replace("ERROR:", "").trim();
        if (/TOKEN_EXPIRED/i.test(m)) state("err", "Link expired", "Codes last 24 hours. Request a fresh one from Settings > Campus.");
        else if (/TOKEN_MISMATCH/i.test(m)) { state("err", "That code isn't right", "Try again, or request a fresh code."); $("paste").hidden = false; }
        else if (/AUTH/i.test(m)) { state("err", "Sign in to finish", "Open ai.spaincos.com, sign in, then reopen this link."); $("home").hidden = false; }
        else if (/ALREADY/i.test(m)) { state("ok", "Already verified", "This account has claimed its student bonus."); $("home").hidden = false; }
        else state("err", "Couldn't verify", m || "Please request a new code from Settings > Campus.");
      }
    }).catch(function () { state("err", "Network error", "Check your connection and reopen the link."); });
  }
  if (token) { confirmNow(token); return; }
  // No token in URL — paste-a-code path.
  state("pending", "Enter your verification code", "Paste the code from your verification email.");
  $("paste").hidden = false;
  $("go").addEventListener("click", function () { var v = $("code").value.trim(); if (v) confirmNow(v); });
  $("code").addEventListener("keydown", function (e) { if (e.key === "Enter") { var v = $("code").value.trim(); if (v) confirmNow(v); } });
})();
</script>
</body>
</html>
