name: qa-gates
# v354 (2026-11-25): ALL repo QA gates, CI-enforced — no gate that only runs when
# someone remembers to. Blocks merges on failure (pull_request) and, hourly, sweeps
# LIVE production and auto-files a regression issue if anything drifted.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    # v355 owner directive: near-constant monitoring — the fast pure-HTTP sweep
    # runs every 5 minutes (GitHub Actions floor); deep Playwright checks stay
    # on their own hourly schedules (perf-budget.yml, brand-leak).
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CSP inline-script hash gate
        run: python3 qa/csp-hash-check.py
      - name: Pricing single-source gate
        run: python3 qa/pricing-consistency.py
      - name: Register/doc drift gate (headline integrity)
        run: python3 qa/register-drift-check.py
      - name: Node module syntax gate (all modules parse)
        run: |
          fails=0
          for f in modules/*.js; do node --check "$f" || fails=1; done
          exit $fails

  live-sweep:
    # Only on schedule/dispatch — live production checks; failure files a regression issue.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live health sweep (status page, health endpoint, SEO heads, robots)
        run: python3 qa/live-sweep.py
      - name: File regression issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `regression: hourly live sweep failed (${new Date().toISOString().slice(0,13)}Z)`,
              labels: ["regression"],
              body: `The hourly live sweep failed. Run: ${runUrl}\n\nThe master-doc closure loop should pick this up, diagnose, and open a fix PR. Do not close until the sweep passes on the next run.`
            });
      - name: Ping the estate heartbeat function (continuous record layer)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          code=$(curl -s -o /tmp/hb.json -w "%{http_code}" "https://bnxermyboeigvwonfrzx.supabase.co/functions/v1/heartbeat" || echo 000)
          echo "heartbeat HTTP $code: $(head -c 400 /tmp/hb.json)"
          test "$code" = "200"

