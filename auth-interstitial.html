<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — ai workspace</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="This is a private workspace. Sign in to continue.">
<style>
  :root { --bg: #0C0E14; --fg: #E8ECF4; --muted: #9AA4B8; --border: #232A3A; --surface: #141824; --accent: #5B8CFF; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  .card { max-width: 420px; margin: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; text-align: center; }
  h1 { font-size: 20px; font-weight: 650; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .btn { display: inline-block; background: var(--accent); color: #0C0E14; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer; font-size: 14px; }
  .btn:hover { opacity: .9; }
  footer { margin-top: 24px; font-size: 12px; color: var(--muted); }
  footer a { color: #7FB4FF; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Private workspace</h1>
  <p>This workspace is private. Sign in with your account to continue, or return to the public site.</p>
  <noscript><p>JavaScript is required to sign in.</p></noscript>
  <button class="btn" id="go" type="button">Continue to sign in</button>
  <footer><a href="/">Public site</a> &middot; <a href="/help.html">Help</a> &middot; <a href="/privacy.html">Privacy</a></footer>
</div>
<script>
// AG-01 auth interstitial: JS-capable visitors proceed to the workspace sign-in
// card; crawlers without JS see only this noindex gate (no workspace content).
document.getElementById("go").addEventListener("click", function () { proceed(); });
function proceed() {
  try { document.cookie = "ws=1; max-age=86400; path=/; SameSite=Lax"; } catch (e) {}
  window.location.replace(window.location.pathname + window.location.search);
}
if (window.supabase && window.supabase.auth && window.supabase.auth.getSession) {
  window.supabase.auth.getSession().then(function (r) {
    if (r && r.data && r.data.session) proceed();
  }).catch(function () {});
}
</script>
</body>
</html>
